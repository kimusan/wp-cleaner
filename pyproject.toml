[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-scanner"
version = "1.0.0"
description = "WordPress malware scanner with headless and Textual TUI modes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Kim Schulz", email = "kim@schulz.dk" }
]
keywords = ["wordpress", "security", "malware", "scanner", "tui"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.58.0", "rich>=13.0.0"]

[project.scripts]
wp-scanner = "wp_scanner:main"

[tool.setuptools]
py-modules = ["wp_scanner"]
